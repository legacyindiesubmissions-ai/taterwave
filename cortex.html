<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cortex | Tater Labs</title>
<style>
    :root {
        --bg-color: #050510;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-main: #e0e0e0;
        --text-muted: #888;
        --accent-green: #4CAF50;
        --accent-blue: #4285F4;
        --accent-purple: #BB86FC;
        --hover-bg: rgba(255, 255, 255, 0.03);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .cortex-container { display: flex; width: 100%; max-width: 1200px; flex-direction: row; }
    
    .sidebar-left { width: 275px; padding: 20px; border-right: 1px solid var(--border-color); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; z-index: 100; }
    .brand { font-size: 1.5rem; font-weight: 900; color: #fff; text-decoration: none; margin-bottom: 40px; }
    .brand span { color: var(--accent-blue); }
    .nav-item { display: flex; align-items: center; padding: 15px 20px; color: var(--text-main); text-decoration: none; font-size: 1.2rem; font-weight: 600; border-radius: 30px; margin-bottom: 10px; transition: background 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; text-align: left; }
    .nav-item:hover { background: var(--hover-bg); }
    .btn-synapse { background: var(--accent-blue); color: #fff; border: none; border-radius: 30px; padding: 15px; font-weight: 700; margin-top: 20px; cursor: pointer; }
    
    .main-feed { flex: 1; max-width: 600px; border-right: 1px solid var(--border-color); min-height: 100vh; }
    .feed-header { padding: 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(10px); }
    .composer { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .composer textarea { background: transparent; border: none; color: var(--text-main); font-size: 1.1rem; outline: none; min-height: 60px; font-family: inherit; width: 100%; }
    .btn-small { background: var(--accent-blue); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-weight: 700; cursor: pointer; align-self: flex-end; }
    .synapse { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; gap: 15px; }
    .synapse-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); object-fit: cover; background: #111; flex-shrink: 0; }
    .synapse-content { flex: 1; }
    .synapse-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .author-name { font-weight: 700; color: #fff; }
    .synapse-content h3 { font-size: 1rem; margin-bottom: 5px; color: var(--accent-blue); }
    .synapse-content p { line-height: 1.4; color: #ccc; }
    .nested-synapse { margin-left: 50px; border-left: 2px solid var(--border-color); }
    .synapse-image { margin-top: 10px; border-radius: 12px; border: 1px solid var(--border-color); max-width: 100%; max-height: 400px; object-fit: cover; }
    
    .pulse-dot { width: 8px; height: 8px; background: #ff4b2b; border-radius: 50%; display: inline-block; margin-left: 8px; box-shadow: 0 0 10px #ff4b2b; display: none; }
    .nav-pulse.active .pulse-dot { display: inline-block; }
    
    .synapse-footer { display: flex; gap: 20px; margin-top: 15px; }
    .engagement-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 0.85rem; cursor: pointer; transition: color 0.2s; }
    .engagement-item:hover { color: var(--accent-blue); }
    .engagement-item svg { width: 16px; height: 16px; fill: currentColor; }

    .composer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .btn-attach { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 20px; padding: 8px 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .btn-attach:hover { background: var(--hover-bg); border-color: var(--accent-blue); }
    .btn-attach svg { width: 18px; height: 18px; fill: currentColor; }
    #media-preview { margin-top: 10px; max-height: 150px; border-radius: 8px; display: none; }
    
    .synapse-actions { position: relative; }
    .btn-meatball { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; border-radius: 50%; transition: background 0.2s; display: flex; }
    .btn-meatball:hover { background: var(--hover-bg); color: #fff; }
    .btn-meatball svg { width: 18px; height: 18px; fill: currentColor; }
    
    .actions-dropdown { position: absolute; right: 0; top: 100%; background: #111; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; z-index: 10; min-width: 120px; overflow: hidden; }
    .actions-dropdown button { width: 100%; padding: 10px 15px; background: transparent; border: none; color: #eee; text-align: left; cursor: pointer; font-size: 0.85rem; transition: background 0.2s; }
    .actions-dropdown button:hover { background: var(--hover-bg); }
    .actions-dropdown button.btn-delete { color: #ff4b2b; }
    
    .stream-profile-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.01); }
    .user-avatar-med { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); background: #111; }
    .profile-info h3 { font-size: 1.1rem; color: #fff; }
    .profile-info p { font-size: 0.85rem; color: var(--text-muted); }

    .sidebar-right { width: 320px; padding: 20px; position: sticky; top: 0; height: 100vh; }
    .vitals-box { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .vitals-metric { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; text-align: center; }
    .vitals-metric small { color: var(--text-muted); font-size: 0.7rem; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .vitals-metric span { font-weight: 700; color: #fff; font-size: 1rem; }
    
    .search-container { position: relative; margin-bottom: 20px; }
    .search-input { width: 100%; padding: 12px 15px; background: #111; border: 1px solid var(--border-color); border-radius: 30px; color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent-blue); }
    .search-results { position: absolute; top: 100%; left: 0; width: 100%; background: #111; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 200; display: none; max-height: 300px; overflow-y: auto; }
    .search-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
    .search-item:hover { background: var(--hover-bg); }
    .search-item small { color: var(--text-muted); font-size: 0.8rem; }
    .hashtag { color: var(--accent-blue); text-decoration: none; cursor: pointer; }
    .hashtag:hover { text-decoration: underline; }
    
    /* Responsive: Desktop-First, Graceful Mobile Compatibility */
    @media (max-width: 1024px) {
        .sidebar-right { display: none; }
    }
    
    @media (max-width: 768px) {
        .cortex-container { flex-direction: column; }
        .sidebar-left { 
            width: 100%; 
            height: auto; 
            flex-direction: row; 
            border-right: none; 
            border-bottom: 1px solid var(--border-color); 
            padding: 10px;
        }
        .brand { margin-bottom: 0; font-size: 1.2rem; }
        .main-feed { border-right: none; max-width: 100%; }
        #auth-modal > div { width: 95% !important; }
    }
</style>
</head>
<body>
<div class="cortex-container">
    <nav class="sidebar-left">
        <a href="index.html" class="brand">The <span>Cortex</span></a>
        <a href="#" class="nav-item active">Stream</a>
        <a href="taterwave.html" class="nav-item">TaterWave</a>
        <a href="mnemosyne.html" class="nav-item">Mnemosyne</a>
        <div id="auth-section">
            <button class="nav-item" onclick="showAuthModal('login')">Login</button>
            <button class="nav-item" onclick="showAuthModal('register')">Register</button>
        </div>
        <div id="user-section" style="display:none;">
            <button class="nav-item nav-pulse" onclick="showNotifications()">
                Pulse <span class="pulse-dot"></span>
            </button>
            <a href="messages.html" class="nav-item">Messages</a>
            <a href="profile.html" class="nav-item" id="user-handle"></a>
            <button class="nav-item" onclick="logout()">Logout</button>
        </div>
    </nav>
    <main class="main-feed">
        <div class="feed-header"><h2>Synaptic Stream</h2></div>
        <div style="padding: 20px 20px 0 20px;">
            <div class="search-container">
                <input type="text" id="neural-search" class="search-input" placeholder="Search the collective..." oninput="neuralSearch(this.value)">
                <div id="search-results" class="search-results"></div>
            </div>
        </div>
        <div id="stream-profile-header" class="stream-profile-header" style="display:none;">
            <img id="header-avatar" class="user-avatar-med" src="" alt="Avatar">
            <div class="profile-info">
                <h3 id="header-handle"></h3>
                <p>Authorized Neural Interface</p>
            </div>
        </div>
        <div class="composer">
            <textarea id="composer-text" placeholder="Initiate a synapse..."></textarea>
            <img id="media-preview" src="">
            <div class="composer-actions">
                <label class="btn-attach" title="Attach Photo">
                    <input type="file" id="synapse-media" accept="image/*" style="display:none;" onchange="previewSynapseMedia(event)">
                    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38.67-2.5 1.5-2.5s1.5 1.12 1.5 2.5v12.5c0 .55-.45 1-1 1s-1-.45-1-1V6H8v11.5c0 1.93 1.57 3.5 3.5 3.5s3.5-1.57 3.5-3.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
                    Media
                </label>
                <button id="fire-synapse" class="btn-small">Fire</button>
            </div>
        </div>
        <div id="feed"></div>
    </main>
    <aside class="sidebar-right">
        <div class="vitals-box">
            <h3>Laboratory Vitals</h3>
            <p id="api-status">Checking...</p>
            <p>Feedback: <span id="api-feedback">-</span></p>
        </div>
    </aside>
</div>

<div id="notifications-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:#111; padding:30px; border-radius:16px; border:1px solid #333; width:400px; max-height:80vh; overflow-y:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 style="color:#fff;">Synaptic Pulse</h2>
            <button onclick="closeNotifications()" style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:1.5rem;">&times;</button>
        </div>
        <div id="notifications-list"></div>
    </div>
</div>

<div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:#111; padding:30px; border-radius:16px; border:1px solid #333; width:300px;">
        <h2 id="modal-title" style="margin-bottom:20px; color:#fff;">Login</h2>
        <div id="captcha-container" style="margin-bottom:15px; text-align:center;"></div>
        <input type="text" id="auth-handle" placeholder="Handle" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff;">
        <input type="password" id="auth-password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff;">
        <input type="email" id="auth-email" placeholder="Email (Register only)" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff; display:none;">
        <button onclick="submitAuth()" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; border-radius:8px; cursor:pointer;">Submit</button>
        <button onclick="closeModal()" style="width:100%; padding:10px; margin-top:10px; background:transparent; color:#888; border:none; cursor:pointer;">Cancel</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    let authMode = 'login';
    let currentChallengeId = '';
    let clickX = null;
    let clickY = null;

    async function loadChallenge() {
        try {
            clickX = null;
            clickY = null;
            const res = await fetch('/api/challenge');
            const data = await res.json();
            currentChallengeId = data.id;
            const container = document.getElementById('captcha-container');
            container.innerHTML = data.svg;
            
            const svg = container.querySelector('svg');
            if (!svg) throw new Error('No SVG in captcha data');
            svg.style.cursor = 'crosshair';
            svg.onclick = (e) => {
                const rect = svg.getBoundingClientRect();
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
                
                // Visual feedback for click
                const dot = document.createElement('div');
                dot.style.position = 'absolute';
                dot.style.left = (e.clientX - rect.left + container.offsetLeft - 2) + 'px';
                dot.style.top = (e.clientY - rect.top + container.offsetTop - 2) + 'px';
                dot.style.width = '4px';
                dot.style.height = '4px';
                dot.style.background = '#4CAF50';
                dot.style.borderRadius = '50%';
                dot.style.pointerEvents = 'none';
                container.style.position = 'relative';
                const oldDot = container.querySelector('.click-dot');
                if (oldDot) oldDot.remove();
                dot.className = 'click-dot';
                container.appendChild(dot);
            };
        } catch (err) {
            console.error('Failed to load captcha:', err);
            document.getElementById('captcha-container').innerText = 'Failed to load CAPTCHA. Is API running?';
        }
    }

    function showAuthModal(mode) {
        authMode = mode;
        document.getElementById('modal-title').innerText = mode.toUpperCase();
        document.getElementById('auth-email').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('auth-modal').style.display = 'flex';
        loadChallenge();
    }
    function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

    async function submitAuth() {
        const btn = event.target;
        const originalText = btn.innerText;
        
        const handle = document.getElementById('auth-handle').value;
        const password = document.getElementById('auth-password').value;
        const email = document.getElementById('auth-email').value;
        
        if (!handle || !password || (authMode === 'register' && !email)) {
            alert('Please fill all fields');
            return;
        }

        if (!currentChallengeId || clickX === null || clickY === null) {
            alert('Please complete the CAPTCHA (click the red circle)');
            return;
        }

        btn.innerText = 'Processing...';
        btn.disabled = true;

        const hash = CryptoJS.SHA256(password).toString();
        
        const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
        const body = { 
            handle, 
            hash, 
            challenge_id: currentChallengeId, 
            x: Math.round(clickX), 
            y: Math.round(clickY) 
        };
        if (authMode === 'register') body.email = email;

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                if (authMode === 'login') {
                    const data = await res.json();
                    localStorage.setItem('tater_token', data.token);
                    location.reload();
                } else {
                    alert('Registered. Please login.');
                    showAuthModal('login');
                }
            } else {
                const err = await res.text();
                alert('Auth failed: ' + err);
                loadChallenge(); 
            }
        } catch (e) {
            alert('Network error. Is the API running?');
        } finally {
            btn.innerText = originalText;
            btn.disabled = false;
        }
    }

    function previewSynapseMedia(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('media-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    async function resonate(id) {
        const token = localStorage.getItem('tater_token');
        if (!token) {
            showAuthModal('login');
            return;
        }
        const res = await fetch('/api/resonate', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ synapse_id: id })
        });
        if (res.ok) loadPosts();
    }

    async function fireSynapse() {
        const content = document.getElementById('composer-text').value;
        const mediaInput = document.getElementById('synapse-media');
        if (!content && mediaInput.files.length === 0) return;
        
        const token = localStorage.getItem('tater_token');
        if (!token) {
            showAuthModal('login');
            return;
        }

        const formData = new FormData();
        formData.append('content', content);
        formData.append('parent_id', replyParentId);
        if (mediaInput.files.length > 0) {
            formData.append('media', mediaInput.files[0]);
        }

        const res = await fetch('/api/synapse', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
        });
        
        if (res.ok) {
            cancelReply();
            document.getElementById('synapse-media').value = '';
            document.getElementById('media-preview').style.display = 'none';
            loadPosts();
        } else {
            alert('Transmission failed. Ensure login is active.');
        }
    }

    document.getElementById('fire-synapse').addEventListener('click', fireSynapse);

    function timeAgo(dateParam) {
        if (!dateParam) return null;
        const date = typeof dateParam === 'object' ? dateParam : new Date(dateParam);
        const today = new Date();
        const seconds = Math.round((today - date) / 1000);
        const minutes = Math.round(seconds / 60);
        const hours = Math.round(minutes / 60);
        const days = Math.round(hours / 24);

        if (seconds < 60) return 'just now';
        if (minutes < 60) return `${minutes}m ago`;
        if (hours < 24) return `${hours}h ago`;
        if (days < 7) return `${days}d ago`;
        return date.toLocaleDateString();
    }

    let currentUserHandle = '';
    let replyParentId = 0;

    function replySynapse(id, handle) {
        replyParentId = id;
        const composer = document.getElementById('composer-text');
        composer.value = handle + ' ';
        composer.focus();
        document.getElementById('fire-synapse').innerText = 'Reply';
        
        // Visual indicator for replying
        const header = document.querySelector('.feed-header h2');
        header.innerHTML = `Replying to ${handle} <span style="font-size:0.8rem; color:var(--accent-blue); cursor:pointer;" onclick="cancelReply()">(Cancel)</span>`;
    }

    function cancelReply() {
        replyParentId = 0;
        document.getElementById('composer-text').value = '';
        document.getElementById('fire-synapse').innerText = 'Fire';
        let currentUserHandle = '';
        let userRole = 'user';
        let replyParentId = 0;

        async function checkSession() {
            const token = localStorage.getItem('tater_token');
            if (!token) {
                document.getElementById('stream-profile-header').style.display = 'none';
                return;
            }

            const res = await fetch('/api/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                const data = await res.json();
                currentUserHandle = data.handle;
                userRole = data.role || 'user';
                document.getElementById('auth-section').style.display = 'none';

            document.getElementById('user-section').style.display = 'block';
            document.getElementById('user-handle').innerText = '@' + data.handle;
            
            // Update Stream Header
            document.getElementById('stream-profile-header').style.display = 'flex';
            document.getElementById('header-handle').innerText = '@' + data.handle;
            if (data.avatar) {
                const headerAvatar = document.getElementById('header-avatar');
                headerAvatar.src = data.avatar.startsWith('/') ? '/api' + data.avatar : data.avatar;
                headerAvatar.style.display = 'block';
            } else {
                document.getElementById('header-avatar').style.display = 'none';
            }
        } else {
            localStorage.removeItem('tater_token');
            document.getElementById('stream-profile-header').style.display = 'none';
        }
    }

    function parseHashtags(text) {
        return text.replace(/#(\w+)/g, '<a class="hashtag" onclick="filterByTag(\'$1\')">#$1</a>');
    }

    async function neuralSearch(query) {
        const resultsEl = document.getElementById('search-results');
        if (query.length < 2) {
            resultsEl.style.display = 'none';
            return;
        }

        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data.users.length === 0 && data.synapses.length === 0) {
            resultsEl.innerHTML = '<div class="search-item"><small>No neural matches found.</small></div>';
        } else {
            const usersHtml = data.users.map(u => `
                <div class="search-item">
                    <img src="${u.avatar ? '/api' + u.avatar : ''}" class="synapse-avatar" style="width:24px; height:24px;">
                    <span style="flex:1;">@${u.handle}</span>
                    <button onclick="startDM('${u.handle}')" style="background:var(--accent-blue); color:#fff; border:none; border-radius:4px; padding:4px 8px; font-size:0.7rem; cursor:pointer;">Message</button>
                </div>`).join('');
            
            const synapseHtml = data.synapses.map(s => `
                <div class="search-item" onclick="filterByTag('${query}')">
                    <div style="flex:1;">
                        <div style="font-weight:700; font-size:0.8rem;">@${s.author}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">${s.content.substring(0, 40)}...</div>
                    </div>
                </div>`).join('');
            
            resultsEl.innerHTML = usersHtml + synapseHtml;
        }
        resultsEl.style.display = 'block';
    }

    function filterByTag(tag) {
        document.getElementById('neural-search').value = '#' + tag;
        document.getElementById('search-results').style.display = 'none';
        // Future: Filter the actual feed by tag
    }

    function startDM(handle) {
        window.location.href = `messages.html?with=${handle}`;
    }

    async function loadPosts() {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const feed = document.getElementById('feed');
        if (!posts || posts.length === 0) {
            feed.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-muted);">No synapses detected in this sector yet.</div>';
            return;
        }

        const postMap = {};
        const roots = [];
        posts.forEach(p => {
            postMap[p.id] = { ...p, children: [] };
        });
        posts.forEach(p => {
            if (p.parent_id && postMap[p.parent_id]) {
                postMap[p.parent_id].children.push(postMap[p.id]);
            } else {
                roots.push(postMap[p.id]);
            }
        });

        function renderSynapse(p, depth = 0) {
            const avatarSrc = p.avatar ? (p.avatar.startsWith('/') ? '/api' + p.avatar : p.avatar) : '';
            const avatarHtml = avatarSrc ? `<img src="${avatarSrc}" class="synapse-avatar">` : `<div class="synapse-avatar"></div>`;
            const imageSrc = p.image ? (p.image.startsWith('/') ? '/api' + p.image : p.image) : '';
            const imageHtml = imageSrc ? `<img src="${imageSrc}" class="synapse-image">` : '';
            const displayTime = timeAgo(p.created_at);
            
            const isAuthor = currentUserHandle && p.author_handle === currentUserHandle;
            const isAdmin = userRole === 'admin';
            
            let menuHtml = '';
            if (isAuthor || isAdmin) {
                menuHtml = `
                    <div class="synapse-actions">
                        <button class="btn-meatball" onclick="toggleActions(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </button>
                        <div id="actions-${p.id}" class="actions-dropdown">
                            ${isAuthor ? `<button onclick="editSynapse(${p.id}, '${p.content.replace(/'/g, "\\'")}')">Edit</button>` : ''}
                            ${isAuthor ? `<button class="btn-delete" onclick="deleteSynapse(${p.id})">Delete</button>` : ''}
                            ${isAdmin && !isAuthor ? `<button class="btn-delete" onclick="banNode('${p.author_handle}')">Ban Node</button>` : ''}
                        </div>
                    </div>`;
            }

            const synapseHtml = `
                <article class="synapse ${depth > 0 ? 'nested-synapse' : ''}" style="${depth > 3 ? 'margin-left:20px;' : ''}">
                    ${avatarHtml}
                    <div class="synapse-content">
                        <div class="synapse-header">
                            <div>
                                <span class="author-name">@${p.author_handle || 'anonymous'}</span>
                                <small style="color:var(--text-muted); margin-left: 8px;" title="${new Date(p.created_at).toLocaleString()}">· ${displayTime}</small>
                            </div>
                            ${menuHtml}
                        </div>
                        <h3>${p.title}</h3>
                        <p id="content-${p.id}">${parseHashtags(p.content)}</p>
                        ${imageHtml}
                        <div class="synapse-footer">
                            <div class="engagement-item" onclick="resonate(${p.id})">
                                <svg viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                <span>${p.resonation || 0}</span>
                            </div>
                            <div class="engagement-item" onclick="replySynapse(${p.id}, '@${p.author_handle}')">
                                <svg viewBox="0 0 24 24"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
                                <span>Reply</span>
                            </div>
                            <div class="engagement-item" style="cursor:default;">
                                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                                <span>${p.views || 0}</span>
                            </div>
                        </div>
                    </div>
                </article>`;
            
            const childrenHtml = p.children.map(c => renderSynapse(c, depth + 1)).join('');
            return synapseHtml + childrenHtml;
        }

        feed.innerHTML = roots.map(r => renderSynapse(r)).join('');
    }

    function toggleActions(id) {
        const el = document.getElementById(`actions-${id}`);
        const isShown = el.style.display === 'block';
        document.querySelectorAll('.actions-dropdown').forEach(d => d.style.display = 'none');
        if (!isShown) el.style.display = 'block';
        
        // Close on outside click
        window.onclick = (e) => {
            if (!e.target.closest('.synapse-actions')) {
                document.querySelectorAll('.actions-dropdown').forEach(d => d.style.display = 'none');
            }
        };
    }

    async function banNode(handle) {
        if (!confirm(`Are you sure you want to deactivate neural node @${handle}? This will erase their presence from the laboratory.`)) return;
        
        const token = localStorage.getItem('tater_token');
        const res = await fetch('/api/admin/ban', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ handle })
        });
        
        if (res.ok) {
            alert('Node deactivated.');
            loadPosts();
        } else {
            alert('Governance action failed.');
        }
    }
    async function deleteSynapse(id) {
        if (!confirm('Are you sure you want to delete this synapse? This neural erasure is permanent.')) return;
        
        const token = localStorage.getItem('tater_token');
        const res = await fetch('/api/synapse/delete', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ id })
        });
        
        if (res.ok) {
            loadPosts();
        } else {
            alert('Failed to delete synapse.');
        }
    }
    }

    async function editSynapse(id, oldContent) {
        const newContent = prompt('Edit your synapse:', oldContent);
        if (newContent === null || newContent === oldContent) return;

        const token = localStorage.getItem('tater_token');
        const res = await fetch('/api/synapse/edit', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ id, content: newContent })
        });
        
        if (res.ok) {
            loadPosts();
        } else {
            alert('Failed to edit synapse.');
        }
    }

    function logout() {
        localStorage.removeItem('tater_token');
        location.reload();
    }

    async function loadVitals() {
        try {
            const res = await fetch('/api/vitals');
            const data = await res.json();
            
            const vitalsBox = document.querySelector('.vitals-box');
            const latestUser = data.latest_member || 'None';
            const totalResearchers = data.total_members || 0;
            const totalSynapses = data.total_synapses || 0;
            const latency = data.latency || 'Checking...';

            const greetings = [
                `New neural node established: Welcome @${latestUser} to the laboratory.`,
                `Cognitive sync complete: @${latestUser} has entered the Cortex.`,
                `Neural interface active: @${latestUser} is now online.`,
                `Welcome, researcher @${latestUser}. Synaptic connection verified.`
            ];
            const greeting = latestUser !== 'None' ? greetings[Math.floor(Math.random() * greetings.length)] : 'Waiting for new neural connections...';

            vitalsBox.innerHTML = `
                <h3 style="margin-bottom:15px;">Laboratory Vitals</h3>
                <div style="padding: 12px; background: rgba(66, 133, 244, 0.05); border-radius: 8px; border: 1px solid rgba(66, 133, 244, 0.1); font-size: 0.85rem; line-height: 1.4; margin-bottom: 20px;">
                    ${greeting}
                </div>
                
                <div class="vitals-grid">
                    <div class="vitals-metric">
                        <small>Researchers</small>
                        <span>${totalResearchers}</span>
                    </div>
                    <div class="vitals-metric">
                        <small>Synapses</small>
                        <span>${totalSynapses}</span>
                    </div>
                    <div class="vitals-metric">
                        <small>Pulse</small>
                        <span>${latency}</span>
                    </div>
                    <div class="vitals-metric">
                        <small>Status</small>
                        <span style="color:var(--accent-green);">ACTIVE</span>
                    </div>
                </div>
            `;
        } catch (e) {
            document.querySelector('.vitals-box').innerHTML = '<h3>Laboratory Vitals</h3><p style="color:#ff4b2b;">CONNECTION LOST</p>';
        }
    }

    async function showNotifications() {
        const token = localStorage.getItem('tater_token');
        if (!token) return;

        const res = await fetch('/api/notifications', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const alerts = await res.json();
        const container = document.getElementById('notifications-list');
        
        if (alerts.length === 0) {
            container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No new synaptic pulses.</p>';
        } else {
            container.innerHTML = alerts.map(a => {
                let typeText = '';
                let link = '#';
                if (a.type === 'resonate') {
                    typeText = 'resonated with your synapse';
                } else if (a.type === 'reply') {
                    typeText = 'replied to you';
                } else if (a.type === 'dm') {
                    typeText = 'sent you a private synapse';
                    link = `messages.html?with=${a.source}`;
                }
                
                return `
                    <div style="padding:15px 0; border-bottom:1px solid #222; cursor:pointer;" onclick="window.location.href='${link}'">
                        <span style="font-weight:700; color:var(--accent-blue);">@${a.source}</span> ${typeText}
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">${timeAgo(a.created_at)}</div>
                    </div>`;
            }).join('');
        }
        
        document.getElementById('notifications-modal').style.display = 'flex';
        document.querySelector('.nav-pulse').classList.remove('active');
    }

    function closeNotifications() {
        document.getElementById('notifications-modal').style.display = 'none';
    }

    async function checkNotifications() {
        const token = localStorage.getItem('tater_token');
        if (!token) return;

        const res = await fetch('/api/notifications', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const alerts = await res.json();
        if (alerts.length > 0) {
            document.querySelector('.nav-pulse').classList.add('active');
        }
    }

    loadPosts();
    checkSession();
    loadVitals();
    setInterval(checkNotifications, 30000); // Check every 30s
</script>
