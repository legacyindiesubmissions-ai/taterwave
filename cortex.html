<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cortex | Tater Labs</title>
<style>
    :root {
        --bg-color: #050510;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-main: #e0e0e0;
        --text-muted: #888;
        --accent-green: #4CAF50;
        --accent-blue: #4285F4;
        --accent-purple: #BB86FC;
        --hover-bg: rgba(255, 255, 255, 0.03);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    .cortex-container { display: flex; width: 100%; max-width: 1200px; flex-direction: row; }
    
    .sidebar-left { width: 275px; padding: 20px; border-right: 1px solid var(--border-color); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
    .brand { font-size: 1.5rem; font-weight: 900; color: #fff; text-decoration: none; margin-bottom: 40px; }
    .brand span { color: var(--accent-blue); }
    .nav-item { display: flex; align-items: center; padding: 15px 20px; color: var(--text-main); text-decoration: none; font-size: 1.2rem; font-weight: 600; border-radius: 30px; margin-bottom: 10px; transition: background 0.2s; cursor: pointer; border: none; background: transparent; width: 100%; }
    .nav-item:hover { background: var(--hover-bg); }
    .btn-signal { background: var(--accent-blue); color: #fff; border: none; border-radius: 30px; padding: 15px; font-weight: 700; margin-top: 20px; cursor: pointer; }
    
    .main-feed { flex: 1; max-width: 600px; border-right: 1px solid var(--border-color); min-height: 100vh; }
    .feed-header { padding: 20px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(10px); }
    .composer { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .composer textarea { background: transparent; border: none; color: var(--text-main); font-size: 1.1rem; outline: none; min-height: 60px; font-family: inherit; width: 100%; }
    .btn-small { background: var(--accent-blue); color: #fff; border: none; border-radius: 20px; padding: 8px 20px; font-weight: 700; cursor: pointer; align-self: flex-end; }
    .signal { padding: 20px; border-bottom: 1px solid var(--border-color); }
    
    .sidebar-right { width: 320px; padding: 20px; position: sticky; top: 0; height: 100vh; }
    .vitals-box { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    
    /* Responsive: Desktop-First, Graceful Mobile Compatibility */
    @media (max-width: 1024px) {
        .sidebar-right { display: none; }
    }
    
    @media (max-width: 768px) {
        .cortex-container { flex-direction: column; }
        .sidebar-left { 
            width: 100%; 
            height: auto; 
            flex-direction: row; 
            border-right: none; 
            border-bottom: 1px solid var(--border-color); 
            padding: 10px;
        }
        .brand { margin-bottom: 0; font-size: 1.2rem; }
        .main-feed { border-right: none; max-width: 100%; }
        #auth-modal > div { width: 95% !important; }
    }
</style>
</head>
<body>
<div class="cortex-container">
    <nav class="sidebar-left">
        <a href="index.html" class="brand">The <span>Cortex</span></a>
        <a href="#" class="nav-item active">Stream</a>
        <a href="taterwave.html" class="nav-item">TaterWave</a>
        <a href="mnemosyne.html" class="nav-item">Mnemosyne</a>
        <div id="auth-section">
            <button class="nav-item" onclick="showAuthModal('login')">Login</button>
            <button class="nav-item" onclick="showAuthModal('register')">Register</button>
        </div>
        <div id="user-section" style="display:none;">
            <a href="profile.html" class="nav-item" id="user-handle"></a>
            <button class="nav-item" onclick="logout()">Logout</button>
        </div>
    </nav>
    <main class="main-feed">
        <div class="feed-header"><h2>Global Stream</h2></div>
        <div class="composer">
            <textarea id="composer-text" placeholder="Transmit a signal..."></textarea>
            <button id="post-signal" class="btn-small">Post</button>
        </div>
        <div id="feed"></div>
    </main>
    <aside class="sidebar-right">
        <div class="vitals-box">
            <h3>Laboratory Vitals</h3>
            <p id="api-status">Checking...</p>
            <p>Feedback: <span id="api-feedback">-</span></p>
        </div>
    </aside>
</div>

<div id="auth-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:#111; padding:30px; border-radius:16px; border:1px solid #333; width:300px;">
        <h2 id="modal-title" style="margin-bottom:20px; color:#fff;">Login</h2>
        <input type="text" id="auth-handle" placeholder="Handle" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff;">
        <input type="password" id="auth-password" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff;">
        <input type="email" id="auth-email" placeholder="Email (Register only)" style="width:100%; padding:10px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff; display:none;">
        <button onclick="submitAuth()" style="width:100%; padding:10px; background:#4285F4; color:#fff; border:none; border-radius:8px; cursor:pointer;">Submit</button>
        <button onclick="closeModal()" style="width:100%; padding:10px; margin-top:10px; background:transparent; color:#888; border:none; cursor:pointer;">Cancel</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    let authMode = 'login';
    function showAuthModal(mode) {
        authMode = mode;
        document.getElementById('modal-title').innerText = mode.toUpperCase();
        document.getElementById('auth-email').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('auth-modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('auth-modal').style.display = 'none'; }

    async function submitAuth() {
        const handle = document.getElementById('auth-handle').value;
        const password = document.getElementById('auth-password').value;
        const email = document.getElementById('auth-email').value;
        const hash = CryptoJS.SHA256(password).toString();
        
        const endpoint = authMode === 'login' ? '/api/login' : '/api/register';
        const body = authMode === 'login' ? { handle, hash } : { handle, email, hash };

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            if (authMode === 'login') {
                location.reload();
            } else {
                alert('Registered. Please login.');
                showAuthModal('login');
            }
        } else {
            alert('Auth failed');
        }
    }

    function logout() {
        fetch('/api/logout', { method: 'POST' }).then(() => location.reload());
    }

    async function postSignal() {
        const content = document.getElementById('composer-text').value;
        if (!content) return;
        
        const res = await fetch('/api/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product: 'Cortex', title: 'New Post', description: content })
        });
        
        if (res.ok) {
            document.getElementById('composer-text').value = '';
            loadPosts();
        } else {
            alert('Unauthorized: Login required.');
        }
    }

    document.getElementById('post-signal').addEventListener('click', postSignal);

    async function loadPosts() {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const feed = document.getElementById('feed');
        feed.innerHTML = posts.map(p => `
            <article class="signal">
                <div class="signal-header">
                    <span class="author-name">@${p.author_handle || 'anonymous'}</span>
                </div>
                <h3>${p.title}</h3>
                <p>${p.content}</p>
            </article>`).join('');
    }

    loadPosts();
    fetch('/api/stats').then(res => res.json()).then(data => {
        document.getElementById('api-status').innerText = 'ONLINE';
        document.getElementById('api-feedback').innerText = data.feedback_count;
    });
</script>
</body>
</html>
