<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Settings | Tater Labs</title>
    <style>
        :root {
            --bg-color: #050510;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-blue: #4285F4;
            --hover-bg: rgba(255, 255, 255, 0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; padding: 40px 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        .header h1 { font-size: 1.8rem; }
        .back-link { color: var(--accent-blue); text-decoration: none; font-weight: 600; }

        .settings-section { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; margin-bottom: 40px; }
        .settings-section h2 { font-size: 1.2rem; margin-bottom: 20px; color: #fff; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; outline: none; font-family: inherit; }
        .form-group textarea { height: 100px; resize: vertical; }
        .avatar-preview { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent-blue); margin-bottom: 20px; object-fit: cover; background: #111; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-blue); }

        .btn-save { background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 700; cursor: pointer; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

        .history-section h2 { font-size: 1.2rem; margin-bottom: 20px; }
        .synapse { background: rgba(255, 255, 255, 0.01); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 15px; display: flex; gap: 15px; }
        .synapse-avatar { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border-color); object-fit: cover; background: #111; flex-shrink: 0; }
        .synapse-content { flex: 1; }
        .synapse-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .synapse-content h3 { font-size: 1rem; margin-bottom: 5px; color: var(--accent-blue); }
        .synapse-content p { color: #ccc; margin-bottom: 10px; line-height: 1.4; }
        .synapse-content small { color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cognitive Settings</h1>
            <a href="cortex.html" class="back-link">← Back to Stream</a>
        </div>

        <div class="settings-section">
            <h2>User Profile</h2>
            <img id="avatar-preview" class="avatar-preview" src="" alt="Avatar Preview" style="display:none;">
            <div class="form-group">
                <label>Handle</label>
                <input type="text" id="profile-handle" readonly style="opacity: 0.6;">
            </div>
            <div class="form-group">
                <label>Cognitive Bio</label>
                <textarea id="profile-bio" placeholder="Describe your neural frequency..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Avatar (Max 2MB, JPG/PNG)</label>
                <input type="file" id="profile-avatar-file" accept="image/*" onchange="previewAvatar(event)">
            </div>
            <button id="save-settings" class="btn-save" onclick="saveSettings()">Save Changes</button>
        </div>

        <div class="history-section">
            <h2>Synaptic History</h2>
            <div id="synapse-feed"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('tater_token');
        if (!token) window.location.href = 'cortex.html';

        function timeAgo(dateParam) {
            if (!dateParam) return null;
            const date = typeof dateParam === 'object' ? dateParam : new Date(dateParam);
            const today = new Date();
            const seconds = Math.round((today - date) / 1000);
            const minutes = Math.round(seconds / 60);
            const hours = Math.round(minutes / 60);
            const days = Math.round(hours / 24);

            if (seconds < 60) return 'just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        async function loadProfile() {
            // Load user identity
            const meRes = await fetch('/api/me', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (meRes.ok) {
                const data = await meRes.json();
                document.getElementById('profile-handle').value = '@' + data.handle;
                if (data.bio) document.getElementById('profile-bio').value = data.bio;
                if (data.avatar) {
                    const preview = document.getElementById('avatar-preview');
                    // Ensure the image loads from the API proxy
                    preview.src = data.avatar.startsWith('/') ? '/api' + data.avatar : data.avatar;
                    preview.style.display = 'block';
                }
            }

            // Load synapse history
            const res = await fetch('/api/user/posts', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const posts = res.ok ? await res.json() : [];
            const container = document.getElementById('synapse-feed');
            if (posts.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">No synapse activity recorded.</p>';
                return;
            }
            container.innerHTML = posts.map(p => {
                const avatarSrc = p.avatar ? (p.avatar.startsWith('/') ? '/api' + p.avatar : p.avatar) : '';
                const avatarHtml = avatarSrc ? `<img src="${avatarSrc}" class="synapse-avatar">` : `<div class="synapse-avatar"></div>`;
                const displayTime = timeAgo(p.created_at);
                return `
                    <article class="synapse">
                        ${avatarHtml}
                        <div class="synapse-content">
                            <div class="synapse-header">
                                <small style="color:var(--text-muted);" title="${new Date(p.created_at).toLocaleString()}">${displayTime}</small>
                            </div>
                            <h3>${p.title}</h3>
                            <p>${p.content}</p>
                        </div>
                    </article>`;
            }).join('');
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('avatar-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function saveSettings() {
            const btn = document.getElementById('save-settings');
            const bio = document.getElementById('profile-bio').value;
            const fileInput = document.getElementById('profile-avatar-file');

            btn.innerText = 'Saving...';
            btn.disabled = true;

            try {
                // 1. Update Bio
                const bioRes = await fetch('/api/profile', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token 
                    },
                    body: JSON.stringify({ bio, avatar: "" }) 
                });

                // 2. Upload Avatar if file selected
                if (fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('avatar', fileInput.files[0]);
                    
                    const uploadRes = await fetch('/api/upload-avatar', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + token },
                        body: formData
                    });
                    
                    if (!uploadRes.ok) {
                        const err = await uploadRes.text();
                        alert('Avatar upload failed: ' + err);
                    }
                }

                if (bioRes.ok) {
                    alert('Cognitive profile updated.');
                    loadProfile(); // Reload to get fresh URLs
                } else {
                    alert('Failed to update bio.');
                }
            } catch (e) {
                alert('Network error.');
            } finally {
                btn.innerText = 'Save Changes';
                btn.disabled = false;
            }
        }

        loadProfile();
    </script>
</body>
</html>
